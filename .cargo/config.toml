# Shortcuts for the in-process conformance tests (emulator/rs/scenarios), run from the repository root:
#   cargo spec [-- filters] [--cpi N] [--jobs N] [-v] [--image label=path] [--json out.json]
#   cargo ble-spec [-- ...]
#   cargo sims [-- scenario names] [--cpi N] [--image ROLE=path] [-v]
#   cargo sims-quick [-- more names or options]  (a few scenarios for every change; the full set in CI)
#   cargo sims-stock  (the quick scenarios of the Rust and the stock firmware together; OUTGLOW_STOCK_DIR;
#                      mixed_chain only nightly until the Rust bulb stops missing one-off frames)
#   cargo stress [-- --full] [--sets stock,c,rust,rust+stock] [--out docs/stress-results.md] [filters]
# The scenarios crate lives in the emulator's own workspace, hence the manifest path.
[alias]
xtask = "run --quiet --release --package xtask --"
spec = "test --manifest-path emulator/rs/Cargo.toml -p scenarios --test spec"
ble-spec = "test --manifest-path emulator/rs/Cargo.toml -p scenarios --test ble"
sims = "test --manifest-path emulator/rs/Cargo.toml -p scenarios --test sims"
sims-quick = "test --manifest-path emulator/rs/Cargo.toml -p scenarios --test sims -- rust_fw rust_ble rust_diag ble_diag zigbee ble_ota"
sims-stock = "test --manifest-path emulator/rs/Cargo.toml -p scenarios --test sims -- rust_radio rust_gp rust_touchlink mixed_parent mixed_mesh mixed_group mixed_conflict back_to_stock_ota"
stress = "test --manifest-path emulator/rs/Cargo.toml -p scenarios --test stress"
