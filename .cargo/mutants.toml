# cargo mutants (https://mutants.rs): what to mutate and how to test it.
# README, "Coverage and mutation testing".
#
# Each mutant is tested with the tests of the package it is in (cargo-mutants'
# default), like the hand-written lists of `cargo xtask mutants`. bulb-core is
# the exception, given on the command line (CI: .github/mutants-diff.sh and
# workflow mutants.yml): its behaviour is tested in bulb-sim, the simulated
# bulb, so its mutants run with `-p bulb-core --test-package bulb-core,bulb-sim
# --timeout 120` (`test_package` here would apply to every package; the timeout,
# because cargo-mutants sets it from the unmutated run of bulb-core's own tests).

exclude_globs = [
  # the simulated bulb the tests of bulb-core run on: a test double
  "crates/bulb-sim/**",
  # the capped allocator every host test binary runs on: test infrastructure
  "crates/memcap/**",
  # the hand-written mutation lists of `cargo xtask mutants`: data
  "xtask/src/mutants/**",
]

exclude_re = [
  # text for people: error messages, serde's "expecting ..."
  "<impl (fmt::|std::fmt::)?(Display|Debug) for ",
  "::expecting -> ",
  # equivalent: the operands of these | have no bit in common, so ^ gives the same octet
  "replace \\| with \\^ in Ble<H>::(set_diag_info|diag_state)$",
  # equivalent: the GATT characteristic properties are one bit each, so READ | WRITE and READ ^ WRITE are the same
  "crates/ble/src/att\\.rs:[0-9]+:[0-9]+: replace \\| with \\^$",
  # equivalent: SHA-256's Ch has disjoint terms and Maj is the same with | in either place
  "crates/ble/src/sha256\\.rs:(24:32|27:33|27:49): replace \\^ with \\| in compress$",
]

# the timeout of a test run is 5x that of the unmutated tree, at least this:
# under a full machine (--jobs, CI's runners) the slower suites vary a lot
minimum_test_timeout = 60
