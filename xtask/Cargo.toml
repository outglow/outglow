[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Repository tasks: build the firmware, the board table, the OTA index, mutation tests"
publish = false

[dependencies]
outglow-image = { path = "../crates/outglow-image" }
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ra-ap-rustc_lexer = "0.185.0"

[dev-dependencies]
memcap = { path = "../crates/memcap" }
