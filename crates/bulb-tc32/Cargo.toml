[package]
name = "bulb-tc32"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Bare-metal bulb firmware for the Telink TLSR8258 (TC32 core): startup, register-level HAL and bulb-core, no vendor code"

# Built only for the target, through `cargo xtask build` (rustc -> LLVM bitcode -> the
# llvm-tc32 clang/lld). It is not a member of the host workspace.
[workspace]

[lib]
crate-type = ["staticlib"]

[features]
default = ["ble", "sense"]
# Bluetooth LE next to Zigbee: the stock bulb's profile for the AwoX app and
# for updates over BLE (`cargo xtask build --no-ble` leaves it out).
ble = ["dep:ble"]
# Diagnostics: a ring in SRAM (ZB_TRACE) with what became of every frame
# the stack handled and what kept the radio from 802.15.4, for the
# emulator's test harness (`cargo xtask build --trace`). Not for the bulbs.
trace = []
# Motion sensing from the RSSI of frames between bulbs (docs/rf-sensing.md):
# probes, Occupancy Sensing and the manufacturer cluster 0xFC5E. In every
# image, off until switched on from Zigbee; `cargo xtask build --no-sense`
# leaves it out.
sense = ["zigbee/sense"]

[dependencies]
bulb-core = { path = "../bulb-core" }
zigbee = { path = "../zigbee" }
ble = { path = "../ble", optional = true }

# The host tests (src/tests/, on the simulated register file of src/sim.rs)
# run on the capped allocator of every host test binary.
[dev-dependencies]
memcap = { path = "../memcap" }

[profile.release]
opt-level = "z"
panic = "abort"
codegen-units = 1
debug = false
