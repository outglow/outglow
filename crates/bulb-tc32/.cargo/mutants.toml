# cargo mutants for crates/bulb-tc32, its own workspace (README, "Coverage and
# mutation testing"): cargo mutants --manifest-path crates/bulb-tc32/Cargo.toml
# Its mutants run its host tests, on the simulated chip of src/sim.rs, with every
# feature: the trace ring and the radio's trace of each transmission are code too.
all_features = true

exclude_globs = [
  # the simulated chip: test infrastructure
  "src/sim.rs",
  # the free stack below the linker's symbols: only on the chip; the host's free() is a stub
  "src/stack.rs",
]

exclude_re = [
  # the register primitives themselves: on the chip volatile MMIO, which host tests
  # cannot reach; on the host one-line calls into the simulated chip
  "^src/reg\\.rs:.*(replace (read|write)(8|16|32) |in (read|write)(8|16|32)$)",
  # flash::read: on the chip the volatile read of the mapped flash
  "^src/flash\\.rs:.*(replace read with |in read$)",
  "<impl (fmt::|std::fmt::)?(Display|Debug) for ",
  # equivalent on the board the tests are built for (the dimmable filament bulb, no cold or colour
  # channel): the setters do nothing there and the questions answer false; the setters' bodies,
  # set_cold and set_colour, and Board::tunable are tested on every board
  "^src/board\\.rs:\\d+:\\d+: replace <impl Pwm for LedPwm>::(set_cold_duty|set_rgb) with \\(\\)$",
  "^src/board\\.rs:\\d+:\\d+: replace <impl Pwm for LedPwm>::(has_cold_channel|has_rgb|white_tw_curve|rgb_beside_white) -> bool with false$",
]

minimum_test_timeout = 60
