[package]
name = "bulb-sim"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Bulb hardware emulator: HAL mocks (PWM, clock, flash, radio) + tests"

[dependencies]
bulb-core = { path = "../bulb-core" }

[dev-dependencies]
# the item ids of the Zigbee stack's store (`NvItem::MAX_ID`), with every
# feature as in the firmware image
zigbee = { path = "../zigbee", features = ["sense"] }
