<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#2a1d12"/><stop offset="1" stop-color="#120d09"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffcf8a" stop-opacity=".95"/>
      <stop offset=".45" stop-color="#f39a4a" stop-opacity=".45"/>
      <stop offset="1" stop-color="#f39a4a" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="210" fill="url(#glow)"/>
  <!-- the O: a ring of light -->
  <circle cx="256" cy="256" r="132" fill="none" stroke="#ffb46a" stroke-width="34" filter="url(#soft)" opacity=".8"/>
  <circle cx="256" cy="256" r="132" fill="none" stroke="#fff1dc" stroke-width="22"/>
  <!-- the filament inside -->
  <path d="M176 270 C 196 214, 216 214, 226 262 S 256 310, 266 262 S 296 214, 306 262 S 326 310, 336 262" fill="none" stroke="#ffb46a" stroke-width="16" stroke-linecap="round" filter="url(#soft)"/>
  <path d="M176 270 C 196 214, 216 214, 226 262 S 256 310, 266 262 S 296 214, 306 262 S 326 310, 336 262" fill="none" stroke="#fff6e8" stroke-width="9" stroke-linecap="round"/>
</svg>
