name: Website (build and deploy)

# The website with the web flasher, built from site/ of outglow/outglow and
# deployed to GitHub Pages of the repository that calls this workflow: this
# one (https://outglow.github.io/outglow/, base /outglow/) and
# outglow/outglow.github.io (https://outglow.github.io/, base /). The firmware
# it offers comes from the published releases of outglow/outglow: their
# Bluetooth images are served by the site itself (firmware/<tag>/...; release
# assets carry no CORS headers, a browser cannot download them), and the
# Zigbee2MQTT OTA index (ota/index.json) lists their OTA files, which
# Zigbee2MQTT downloads from the release.

on:
  workflow_call:
    inputs:
      base:
        description: "Path the site is served under (/outglow/ or /)"
        type: string
        default: /outglow/
      ref:
        description: "Commit of outglow/outglow to build"
        type: string
        default: main
    secrets:
      ORIGINAL_FIRMWARE_DEPLOY_KEY:
        description: "Deploy key of outglow/original-firmware: the comparison page's tests run on the original images"
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: outglow/outglow
          ref: ${{ inputs.ref }}
          # the tags: the comparison page names the release the tested commit belongs to
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      # The comparison page (why.html) shows the conformance tests run on the
      # original firmware and on Outglow (cargo xtask compare). They run here, on
      # every build, so the page follows the code and every original version in
      # outglow/original-firmware; without the key (a fork) or when they cannot
      # run, the committed site/public/compare.json stays, and the page says
      # from when it is.
      - name: Original firmware images for the comparison (outglow/original-firmware; never uploaded)
        id: original
        env:
          KEY: ${{ secrets.ORIGINAL_FIRMWARE_DEPLOY_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "no deploy key: the comparison page keeps the committed results"
            exit 0
          fi
          install -m 600 /dev/null "$RUNNER_TEMP/original-firmware-key" && printf '%s\n' "$KEY" > "$RUNNER_TEMP/original-firmware-key"
          GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/original-firmware-key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
            git clone -q --depth 1 git@github.com:outglow/original-firmware.git "$RUNNER_TEMP/original-firmware"
          rm -f "$RUNNER_TEMP/original-firmware-key"
          # outside the workspace: no artifact path can reach it
          echo "OUTGLOW_STOCK_DIR=$RUNNER_TEMP/original-firmware" >> "$GITHUB_ENV"
          echo "have=1" >> "$GITHUB_OUTPUT"
      - if: steps.original.outputs.have == '1'
        uses: ./.github/actions/tc32-toolchain
      - if: steps.original.outputs.have == '1'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            emulator/rs
      - name: The conformance tests on the original firmware and on Outglow (site/public/compare.json)
        if: steps.original.outputs.have == '1'
        continue-on-error: true
        timeout-minutes: 45
        run: |
          start=$(date +%s)
          cargo xtask compare
          echo "compare: $(( $(date +%s) - start )) s"
          git diff --stat -- site/public/compare.json

      - name: Build the site
        working-directory: site
        env:
          OUTGLOW_BASE: ${{ inputs.base }}
        run: npm ci && npm run build

      - name: Firmware of the releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p rel
          echo '[]' > site/dist/ota/index.json
          echo '{"schema": 1, "images": []}' > site/dist/firmware.json
          # the newest releases first; older ones stay downloadable from GitHub
          for tag in $(gh release list -R outglow/outglow --exclude-drafts --limit 30 --json tagName --jq '[.[].tagName | select(startswith("v"))][:10][]'); do
            mkdir -p "rel/$tag" "site/dist/firmware/$tag"
            gh release download -R outglow/outglow "$tag" -D "rel/$tag" -p 'outglow-*.json' -p '*-ota.bin' || continue
            mv rel/$tag/*-ota.bin "site/dist/firmware/$tag/" 2>/dev/null || true
          done
          # one index and one release list over all of them (fileVersion strings sort as numbers: fixed width)
          if ls rel/*/outglow-index.json >/dev/null 2>&1; then
            jq -s 'add | sort_by(.imageType, .fileVersion)' rel/*/outglow-index.json > site/dist/ota/index.json
            jq -s '{schema: 1, images: (map(.images) | add | sort_by(.board, .fileVersion))}' \
              rel/*/outglow-firmware.json > site/dist/firmware.json
          fi
          echo "$(jq length site/dist/ota/index.json) OTA images, $(jq '.images | length' site/dist/firmware.json) flasher images"

      - name: The original firmware (outglow/original-firmware), for "Restore original firmware"
        continue-on-error: true
        run: |
          git clone -q --depth 1 https://github.com/outglow/original-firmware /tmp/original
          mkdir -p site/dist/original
          cp -R /tmp/original/manifest.json /tmp/original/firmware site/dist/original/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
