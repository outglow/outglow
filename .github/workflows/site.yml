name: Website (build and deploy)

# The website with the web flasher, built from site/ of outglow/outglow and
# deployed to GitHub Pages of the repository that calls this workflow: this
# one (https://outglow.github.io/outglow/, base /outglow/) and
# outglow/outglow.github.io (https://outglow.github.io/, base /). The firmware
# it offers comes from the published releases of outglow/outglow: their
# Bluetooth images are served by the site itself (firmware/<tag>/...; release
# assets carry no CORS headers, a browser cannot download them), and the
# Zigbee2MQTT OTA index (ota/index.json) lists their OTA files, which
# Zigbee2MQTT downloads from the release.

on:
  workflow_call:
    inputs:
      base:
        description: "Path the site is served under (/outglow/ or /)"
        type: string
        default: /outglow/
      ref:
        description: "Commit of outglow/outglow to build"
        type: string
        default: main
    secrets:
      ORIGINAL_FIRMWARE_DEPLOY_KEY:
        description: "Unused since the comparison runs in compare.yml; kept so that callers passing it still work"
        required: false

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: outglow/outglow
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      # The comparison page (why.html) shows the conformance tests run on the
      # original firmware and on Outglow (cargo xtask compare). They are slow, so
      # they run in their own workflow (compare.yml), which asks for a new site
      # when it is done; here the results of its newest successful run on main.
      # When there is none, or it cannot be had (another repository's token),
      # the committed site/public/compare.json stays, and the page says from when it is.
      - name: The comparison page's results (the newest run of compare.yml on main)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh run list -R outglow/outglow -w compare.yml -b main -s success -L 1 --json databaseId -q '.[0].databaseId')
          if [ -z "$id" ]; then
            echo "no comparison run yet: the committed results"
            exit 0
          fi
          gh run download "$id" -R outglow/outglow -n compare-json -D "$RUNNER_TEMP/compare"
          cp "$RUNNER_TEMP/compare/compare.json" site/public/compare.json
          echo "comparison from run $id"

      - name: Build the site
        working-directory: site
        env:
          OUTGLOW_BASE: ${{ inputs.base }}
        run: npm ci && npm run build

      - name: Firmware of the releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p rel
          echo '[]' > site/dist/ota/index.json
          echo '{"schema": 1, "images": []}' > site/dist/firmware.json
          # the newest releases first; older ones stay downloadable from GitHub
          for tag in $(gh release list -R outglow/outglow --exclude-drafts --limit 30 --json tagName --jq '[.[].tagName | select(startswith("v"))][:10][]'); do
            mkdir -p "rel/$tag" "site/dist/firmware/$tag"
            gh release download -R outglow/outglow "$tag" -D "rel/$tag" -p 'outglow-*.json' -p '*-ota.bin' || continue
            mv rel/$tag/*-ota.bin "site/dist/firmware/$tag/" 2>/dev/null || true
          done
          # one index and one release list over all of them. In the index the newest of an image
          # type comes first: Zigbee2MQTT takes the first entry that matches a device
          # (zigbee-herdsman Device.findMatchingOtaImage), not the highest version
          if ls rel/*/outglow-index.json >/dev/null 2>&1; then
            jq -s 'add | sort_by(.imageType, -(.fileVersion | tonumber))' rel/*/outglow-index.json > site/dist/ota/index.json
            jq -s '{schema: 1, images: (map(.images) | add | sort_by(.board, .fileVersion))}' \
              rel/*/outglow-firmware.json > site/dist/firmware.json
          fi
          echo "$(jq length site/dist/ota/index.json) OTA images, $(jq '.images | length' site/dist/firmware.json) flasher images"

      - name: The original firmware (outglow/original-firmware), for "Restore original firmware"
        continue-on-error: true
        run: |
          git clone -q --depth 1 https://github.com/outglow/original-firmware /tmp/original
          mkdir -p site/dist/original
          cp -R /tmp/original/manifest.json /tmp/original/firmware site/dist/original/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
