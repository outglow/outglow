name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # the long scenarios (the whole scenario set on the Rust firmware, the
  # comparisons with the original firmware): jobs nightly-build,
  # firmware-nightly (in parts), firmware-nightly-stock and
  # firmware-nightly-tw; on Sundays (the second schedule) the address
  # conflict measurements instead, job firmware-weekly (nightly-build, then
  # only that)
  schedule:
    - cron: "17 2 * * *"
    - cron: "41 3 * * 0"

permissions:
  contents: read

# the two schedules apart: the weekly run must not cancel a nightly one still going
concurrency:
  group: ci-${{ github.ref }}-${{ github.event.schedule || 'run' }}
  cancel-in-progress: true

jobs:
  host:
    name: Host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # (the shell has dbus and pkg-config for btleplug)
      - uses: ./.github/actions/nix-shell
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            crates/bulb-tc32
            emulator/rs
      - run: cargo test --workspace
      # the firmware's drivers on the simulated chip (crates/bulb-tc32/src/sim.rs),
      # with every feature and with none
      - name: Firmware drivers on the host
        run: |
          cargo test --manifest-path crates/bulb-tc32/Cargo.toml
          cargo test --manifest-path crates/bulb-tc32/Cargo.toml --no-default-features
          cargo test --manifest-path crates/bulb-tc32/Cargo.toml --features trace
      - name: Board tables up to date
        run: cargo xtask boards --check
      - name: Emulator unit tests
        run: cargo test --manifest-path emulator/rs/Cargo.toml -p tc32emu -p ble -p zbnode && cargo test --manifest-path emulator/rs/Cargo.toml -p scenarios --lib

  # line and region coverage of the same host tests (and the emulator's unit
  # tests), in the shell `nix develop .#coverage` (the official rustc with its
  # llvm-tools; flake.nix). The per-crate table goes to the job summary, the
  # HTML report is an artifact; a crate below its baseline in
  # xtask/coverage.tsv fails the job (README, "Coverage and mutation testing")
  coverage:
    name: Coverage
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/nix-shell
        with:
          shell: coverage
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: coverage
          workspaces: |
            .
            crates/bulb-tc32
            emulator/rs
      - run: cargo xtask coverage --emulator --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-html
          path: |
            target/coverage/*/html
            target/coverage/*/summary.json

  site:
    name: Website and flasher
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Bluetooth headers (btleplug; the tests run `outglow ble vectors`)
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm test
      - run: npm run build

  firmware-build:
    name: Firmware build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/tc32-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: Build the firmware (dimmable filament bulb)
        run: cargo xtask build
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-dimm
          path: |
            target/tc32/bulb-tc32.bin
            target/tc32/bulb-tc32-ota.bin
            target/tc32/bulb-tc32.ota
            target/tc32/bulb-tc32.elf
            target/tc32/bulb-tc32.map

  # the image built once, the emulator runs in parallel jobs; every bulb on
  # the Rust firmware (the original firmware: firmware-nightly-stock)
  firmware:
    name: Firmware in the emulator (${{ matrix.part.name }})
    needs: firmware-build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        part:
          - { name: scenarios, run: cargo sims-quick, devtools: true }
          # four Rust bulbs under traffic, noise, churn and a broadcast storm at
          # --cpi 24 (about 30 s); a slow ACK there made a bulb leave (2026-11-18)
          - { name: stress, run: cargo stress -- --sets rust }
          # full fidelity (--cpi 24 shifts timings) against the committed
          # verdicts of emulator/rs/scenarios/expect/{zigbee,ble}-dimm.txt
          - { name: Zigbee conformance, run: cargo spec && cargo ble-spec }
    steps:
      - uses: actions/checkout@v4
      - name: TC32 toolchain (rust_fw disassembles the image with its llvm-objdump)
        uses: ./.github/actions/tc32-toolchain
      - uses: actions/download-artifact@v4
        with:
          name: firmware-dimm
          path: target/tc32
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: emulator/rs
          shared-key: emulator
      - name: tc32-devtools (instruction form check of rust_fw; the build does not need it)
        if: matrix.part.devtools
        run: |
          git clone -q https://github.com/goyamamoto/tc32-devtools "$RUNNER_TEMP/tc32-devtools"
          git -C "$RUNNER_TEMP/tc32-devtools" checkout -q 2e1bcaed762e3124b024047db981172d2b0395ba
          echo "TC32_DEVTOOLS=$RUNNER_TEMP/tc32-devtools" >> "$GITHUB_ENV"
      - run: ${{ matrix.part.run }}

  nightly-build:
    name: Firmware build (every image)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/tc32-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: Build the firmware (dimmable, tunable white, a colour bulb, a second OTA version)
        run: |
          cargo xtask build
          cargo xtask build --board ESMLFzm_w6_TW-4.63
          cargo xtask build --board EGLO_ZM_RGB_TW-4.60
          cargo xtask build --file-version 01000001 --out-dir "$PWD/target/tc32-v2"
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-every
          path: |
            target/tc32*/bulb-tc32.bin
            target/tc32*/bulb-tc32-ota.bin
            target/tc32*/bulb-tc32.ota
            target/tc32*/bulb-tc32.elf

  # every scenario, in parts: `--shard K/N` gives every part about the same
  # time, the longest scenario a part of its own. Every bulb on the Rust
  # firmware, no original firmware here (firmware-nightly-stock)
  firmware-nightly:
    name: Every scenario (part ${{ matrix.shard }} of 6)
    needs: nightly-build
    if: github.event.schedule != '41 3 * * 0'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - name: TC32 toolchain (rust_fw disassembles the image with its llvm-objdump)
        uses: ./.github/actions/tc32-toolchain
      - uses: actions/download-artifact@v4
        with:
          name: firmware-every
          path: target
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: emulator/rs
          shared-key: emulator
      # 4.6 from the Wireshark developers' PPA: the expectations of wireshark and
      # ble_wireshark are Wireshark 4.6's reading; Ubuntu 24.04's own 4.2 decodes
      # some frames differently (touchlink commands, BLE advertising names)
      - name: tshark 4.6 (wireshark and ble_wireshark check the frames with it)
        run: |
          # (Launchpad answers 500 now and then: a few tries)
          for i in 1 2 3 4 5; do sudo add-apt-repository -y ppa:wireshark-dev/stable && break; sleep 20; done
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q tshark
          tshark --version | head -1
      # but the weekly measurements (job firmware-weekly) and the scenarios
      # with the original firmware (job firmware-nightly-stock)
      - name: Scenarios (every bulb on the Rust firmware)
        run: cargo sims -- --shard ${{ matrix.shard }}/6

  # the original firmware: the scenarios that compare with it or act on it
  # (WITH_STOCK in emulator/rs/scenarios/src/sims/mod.rs, `--with-stock`),
  # and the mixed networks with their stock bulbs on the original firmware
  # (`--firmware stock`; by default every bulb there runs the Rust firmware)
  firmware-nightly-stock:
    name: With the original firmware (${{ matrix.part.name }})
    needs: nightly-build
    if: github.event.schedule != '41 3 * * 0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part:
          - { name: comparisons, run: cargo sims-stock }
          - name: mixed networks
            run: cargo sims -- --firmware stock --exact mixed_parent_rust mixed_mesh mixed_chain mixed_rejoin mixed_group mixed_conflict
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/nix-shell
      - uses: actions/download-artifact@v4
        with:
          name: firmware-every
          path: target
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: emulator/rs
          shared-key: emulator
      - uses: ./.github/actions/original-firmware
        with:
          key: ${{ secrets.ORIGINAL_FIRMWARE_DEPLOY_KEY }}
      - run: ${{ matrix.part.run }}

  # the measurements that feed the address conflict study (addr_conflict*,
  # enddev_wallswitch*; emulator/rs/scenarios/src/sims/mod.rs, WEEKLY): on
  # the original firmware (`--firmware stock`) their checks fail only when
  # the bulbs do not join, so once a week; on the Rust firmware they check
  # what Outglow does. addr_conflict_house, nine original bulbs that never
  # idle, takes about 22 min; the others run beside it
  firmware-weekly:
    name: Address conflict measurements, ${{ matrix.firmware }} firmware (weekly)
    needs: nightly-build
    if: github.event.schedule == '41 3 * * 0' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        firmware: [stock, rust]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/nix-shell
      - uses: actions/download-artifact@v4
        with:
          name: firmware-every
          path: target
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: emulator/rs
          shared-key: emulator
      - if: matrix.firmware == 'stock'
        uses: ./.github/actions/original-firmware
        with:
          key: ${{ secrets.ORIGINAL_FIRMWARE_DEPLOY_KEY }}
      - name: The weekly scenarios
        run: cargo sims-weekly --firmware ${{ matrix.firmware }}

  # what pull requests do not run: the conformance tests on the tunable white
  # image (where the Color Control tests apply) and the Zigbee2MQTT converter
  # against the published zigbee-herdsman-converters; every run is checked
  # against its committed verdicts in emulator/rs/scenarios/expect/
  firmware-nightly-conformance:
    name: Conformance (dimmable and tunable white) and the Zigbee2MQTT converter
    needs: nightly-build
    if: github.event.schedule != '41 3 * * 0'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/tc32-toolchain
      - uses: actions/download-artifact@v4
        with:
          name: firmware-every
          path: target
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: emulator/rs
          shared-key: emulator
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Zigbee conformance (dimmable)
        run: cargo spec
      - name: Bluetooth conformance (dimmable)
        run: cargo ble-spec
      - name: Zigbee conformance (tunable white)
        run: cargo spec -- --image rust=target/tc32-tw/bulb-tc32.bin --expect zigbee-tw
      - name: Bluetooth conformance (tunable white)
        run: cargo ble-spec -- --image rust=target/tc32-tw/bulb-tc32.bin --expect ble-tw
      - name: The Zigbee2MQTT converter against zigbee-herdsman-converters
        env:
          ZHC_VERSION: 26.132.0
        run: |
          mkdir -p "$RUNNER_TEMP/zhc" && cd "$RUNNER_TEMP/zhc"
          npm init -y >/dev/null && npm install --silent "zigbee-herdsman-converters@$ZHC_VERSION"
          cd "$GITHUB_WORKSPACE/emulator/rs"
          cargo run -q --release -p scenarios --example device_model -- rust=../../target/tc32/bulb-tc32.bin > "$RUNNER_TEMP/model.json"
          cd "$GITHUB_WORKSPACE"
          ZHC="$RUNNER_TEMP/zhc/node_modules/zigbee-herdsman-converters" node tools/z2m-converter-check.mjs "$RUNNER_TEMP/model.json"

  # the BLE and mesh scenarios and the BLE conformance tests again over 8
  # other starts of the bulbs' system timer (`--sweep 8`, TC32EMU_TICK_OFFSET):
  # other random advertising delays and jitter, as another code layout gives.
  # A test that holds only where the events happen to fall shows here, not
  # first on the build of some later, unrelated change
  firmware-nightly-sweep:
    name: Timing sweep (${{ matrix.part.name }})
    needs: nightly-build
    if: github.event.schedule != '41 3 * * 0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part:
          - { name: BLE and mesh scenarios, run: cargo sims-sweep }
          - name: Bluetooth conformance, dimmable and tunable white
            run: >
              cargo ble-spec -- --sweep 8 &&
              cargo ble-spec -- --image rust=target/tc32-tw/bulb-tc32.bin --expect ble-tw --sweep 8
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/nix-shell
      - uses: actions/download-artifact@v4
        with:
          name: firmware-every
          path: target
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: emulator/rs
          shared-key: emulator
      - uses: ./.github/actions/original-firmware
        with:
          key: ${{ secrets.ORIGINAL_FIRMWARE_DEPLOY_KEY }}
      - run: ${{ matrix.part.run }}

  firmware-nightly-tw:
    name: Tunable white scenarios
    needs: nightly-build
    if: github.event.schedule != '41 3 * * 0'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: TC32 toolchain (rust_fw disassembles the image with its llvm-objdump)
        uses: ./.github/actions/tc32-toolchain
      - uses: actions/download-artifact@v4
        with:
          name: firmware-every
          path: target
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: emulator/rs
          shared-key: emulator
      - uses: ./.github/actions/original-firmware
        with:
          key: ${{ secrets.ORIGINAL_FIRMWARE_DEPLOY_KEY }}
      - name: The stock-and-Rust scenarios on the tunable white pair
        run: >
          cargo sims -- --firmware stock mixed_parent mixed_mesh mixed_group rust_radio rust_gp rust_touchlink
          --image rust=target/tc32-tw/bulb-tc32.bin --image stock=stock/stock-tw.bin
      - name: The device page's BLE service on the tunable white bulb
        run: cargo sims -- ble_diag --image bin=target/tc32-tw/bulb-tc32.bin --image tw=target/tc32-tw/bulb-tc32.bin
