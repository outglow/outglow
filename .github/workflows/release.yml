name: Release

# Pushing a tag vMAJOR.MINOR.PATCH makes a GitHub release with:
# - the firmware of every board: the Zigbee OTA file (outglow-<board>-<version>.ota,
#   for Zigbee2MQTT) and the Bluetooth image (outglow-<board>-<version>-ota.bin,
#   for the web flasher and `outglow ble push`);
# - the index entries of this release (outglow-index.json, outglow-firmware.json),
#   which the website workflow merges into ota/index.json and the flasher's list;
# - release notes: how to install, the files per board, and the changes since
#   the previous release, generated by GitHub from the merged pull requests
#   (grouped by label, .github/release.yml) and commits.
#
#   git tag -a v1.0.0 -m "Outglow 1.0.0" && git push origin v1.0.0
#
# A tag with a suffix (v1.1.0-rc.1) makes a pre-release.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      tag:
        description: an existing tag to (re)build the release of
        required: true

permissions:
  contents: write
  actions: write

jobs:
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: ./.github/actions/tc32-toolchain

      - name: Version from the tag
        id: v
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-.+)?$ ]] || { echo "tag $TAG is not vMAJOR.MINOR.PATCH[-suffix]"; exit 1; }
          major=${BASH_REMATCH[1]} minor=${BASH_REMATCH[2]} patch=${BASH_REMATCH[3]} suffix=${BASH_REMATCH[4]}
          (( major < 256 && minor < 256 && patch < 65536 )) || { echo "version out of range"; exit 1; }
          # the OTA file version: MAJOR, MINOR (a byte each), PATCH (16 bits); 1.0.0 = 0x01000000
          printf 'file=%02x%02x%04x\n' "$major" "$minor" "$patch" >> "$GITHUB_OUTPUT"
          echo "version=$major.$minor.$patch${suffix}" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          [ -n "$suffix" ] && echo "prerelease=--prerelease" >> "$GITHUB_OUTPUT" || echo "prerelease=" >> "$GITHUB_OUTPUT"

      - name: Build every board
        env:
          BULB_FILE_VERSION: ${{ steps.v.outputs.file }}
          # key index 4 for commercial touchlink initiators (not in the repository)
          TOUCHLINK_MASTER_KEY: ${{ secrets.TOUCHLINK_MASTER_KEY }}
        run: cargo xtask build --all

      - name: Assets and index
        env:
          TAG: ${{ steps.v.outputs.tag }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          mkdir -p assets
          echo '[]' > assets/outglow-index.json
          echo '{"schema": 1, "images": []}' > assets/outglow-firmware.json
          cargo xtask index --version "$VERSION" --tag "$TAG" \
            --notes "https://github.com/${{ github.repository }}/releases/tag/$TAG" \
            --index assets/outglow-index.json --site assets/outglow-firmware.json --assets assets \
            $(ls target/tc32*/bulb-tc32.ota | grep -vE -- '-(noble|trace)/')
          (cd assets && sha256sum outglow-*.ota outglow-*-ota.bin > SHA256SUMS)

      - name: Release notes
        env:
          TAG: ${{ steps.v.outputs.tag }}
          VERSION: ${{ steps.v.outputs.version }}
        run: cargo xtask release-notes --version "$VERSION" --tag "$TAG" --assets assets > notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" assets/* --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            # --generate-notes appends GitHub's list of changes since the previous release
            gh release create "$TAG" assets/* --title "Outglow $VERSION" --notes-file notes.md \
              --generate-notes --verify-tag ${{ steps.v.outputs.prerelease }}
          fi

      - name: Update the website
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref "${{ github.event.repository.default_branch }}"
