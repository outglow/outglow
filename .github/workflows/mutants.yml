name: Mutants

# Mutation testing with cargo-mutants (https://mutants.rs; config in
# .cargo/mutants.toml): every mutant is a small change to the code (an
# operator swapped, a function returning a constant); the tests of its
# crate must fail on it. README, "Coverage and mutation testing".
#
# - pull requests: only the mutants in the lines the pull request changes
#   (`--in-diff`); a missed one fails the job: the changed code needs a test
#   that notices it.
# - weekly (and by hand): every mutant of the host workspace and of
#   crates/bulb-tc32, in parts (`--shard K/N`), then one table per crate in the summary of the job
#   `report` and every outcome as artifacts. Missed mutants do not fail it:
#   it measures the gaps still to close.

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 1 * * 6"

permissions:
  contents: read

concurrency:
  group: mutants-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never

jobs:
  diff:
    name: Mutants in the changed code
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # the pull request's head, not the merge commit: the diff's lines are its lines
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: The pull request's changes to Rust sources
        id: diff
        run: |
          git diff "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" -- '*.rs' > "$RUNNER_TEMP/pr.diff"
          if [ -s "$RUNNER_TEMP/pr.diff" ]; then echo "rust=true" >> "$GITHUB_OUTPUT"; else echo "No Rust changes: no mutants." >> "$GITHUB_STEP_SUMMARY"; fi
      - if: steps.diff.outputs.rust
        uses: ./.github/actions/nix-shell
      - if: steps.diff.outputs.rust
        uses: Swatinem/rust-cache@v2
      - name: cargo mutants --in-diff
        if: steps.diff.outputs.rust
        run: .github/mutants-diff.sh "$RUNNER_TEMP/pr.diff" "$RUNNER_TEMP/mutants" 2
      - name: Report
        if: steps.diff.outputs.rust
        run: |
          set -o pipefail
          shopt -s nullglob
          outs=("$RUNNER_TEMP"/mutants/*/mutants.out)
          if [ ${#outs[@]} -gt 0 ]; then
            cargo xtask mutants-report "${outs[@]}" --strict | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "No mutants in the changed lines." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always() && steps.diff.outputs.rust
        with:
          name: mutants-diff
          path: |
            ${{ runner.temp }}/mutants/*/mutants.out/*.json
            ${{ runner.temp }}/mutants/*/mutants.out/*.txt
            ${{ runner.temp }}/mutants/*/mutants.out/diff
          if-no-files-found: ignore

  # the host workspace in 14 parts (round-robin: every part gets mutants of
  # every crate, so the parts take about the same time), bulb-core with
  # bulb-sim's tests in 2, bulb-tc32 (its own workspace) in 1
  shard:
    name: Mutants (${{ matrix.part.name }})
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        part:
          - { name: "part 1 of 14", args: "--workspace --exclude crates/bulb-core/** --shard 0/14 --sharding round-robin" }
          - { name: "part 2 of 14", args: "--workspace --exclude crates/bulb-core/** --shard 1/14 --sharding round-robin" }
          - { name: "part 3 of 14", args: "--workspace --exclude crates/bulb-core/** --shard 2/14 --sharding round-robin" }
          - { name: "part 4 of 14", args: "--workspace --exclude crates/bulb-core/** --shard 3/14 --sharding round-robin" }
          - { name: "part 5 of 14", args: "--workspace --exclude crates/bulb-core/** --shard 4/14 --sharding round-robin" }
          - { name: "part 6 of 14", args: "--workspace --exclude crates/bulb-core/** --shard 5/14 --sharding round-robin" }
          - { name: "part 7 of 14", args: "--workspace --exclude crates/bulb-core/** --shard 6/14 --sharding round-robin" }
          - { name: "part 8 of 14", args: "--workspace --exclude crates/bulb-core/** --shard 7/14 --sharding round-robin" }
          - { name: "part 9 of 14", args: "--workspace --exclude crates/bulb-core/** --shard 8/14 --sharding round-robin" }
          - { name: "part 10 of 14", args: "--workspace --exclude crates/bulb-core/** --shard 9/14 --sharding round-robin" }
          - { name: "part 11 of 14", args: "--workspace --exclude crates/bulb-core/** --shard 10/14 --sharding round-robin" }
          - { name: "part 12 of 14", args: "--workspace --exclude crates/bulb-core/** --shard 11/14 --sharding round-robin" }
          - { name: "part 13 of 14", args: "--workspace --exclude crates/bulb-core/** --shard 12/14 --sharding round-robin" }
          - { name: "part 14 of 14", args: "--workspace --exclude crates/bulb-core/** --shard 13/14 --sharding round-robin" }
          - { name: "bulb-core 1 of 2", args: "-p bulb-core --test-package bulb-core,bulb-sim --timeout 120 --shard 0/2 --sharding round-robin" }
          - { name: "bulb-core 2 of 2", args: "-p bulb-core --test-package bulb-core,bulb-sim --timeout 120 --shard 1/2 --sharding round-robin" }
          - { name: "bulb-tc32", args: "--manifest-path crates/bulb-tc32/Cargo.toml" }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/nix-shell
      # (exit 2 = some missed: the job report counts them)
      - run: |
          read -r -a args <<< "${{ matrix.part.args }}"
          cargo mutants "${args[@]}" --jobs 2 --output "$RUNNER_TEMP" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants-${{ strategy.job-index }}
          # (not the logs of every cargo test: hundreds of MB)
          path: |
            ${{ runner.temp }}/mutants.out/*.json
            ${{ runner.temp }}/mutants.out/*.txt
            ${{ runner.temp }}/mutants.out/diff

  report:
    name: Mutants per crate
    needs: shard
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/nix-shell
      - uses: actions/download-artifact@v4
        with:
          pattern: mutants-*
          path: out
      - run: cargo xtask mutants-report out/mutants-* --missed missed.txt | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: mutants-missed
          path: missed.txt
