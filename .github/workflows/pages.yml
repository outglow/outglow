name: Website

# https://outglow.github.io/outglow/ (the project site). The same site at the
# root, https://outglow.github.io/, is deployed by outglow/outglow.github.io,
# which calls site.yml with the base /.

on:
  push:
    branches: [main]
    paths: [site/**, ota/**, crates/bulb-tc32/boards.tsv, .github/workflows/pages.yml, .github/workflows/site.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  site:
    uses: ./.github/workflows/site.yml
    with:
      base: /outglow/
      ref: ${{ github.sha }}
