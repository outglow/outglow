name: Website

# https://outglow.github.io/outglow/ (the project site). The same site at the
# root, https://outglow.github.io/, is deployed by outglow/outglow.github.io,
# which calls site.yml with the base /: the job `root` tells it which commit
# to build by writing it to its file SOURCE (a deploy key of that repository,
# secret ROOT_SITE_DEPLOY_KEY), and the push starts its build.

on:
  push:
    branches: [main]
    # the firmware, the tests and their runner too: the comparison page shows their results
    paths: [site/**, ota/**, crates/**, emulator/rs/**, xtask/**, .github/workflows/pages.yml, .github/workflows/site.yml]
  # weekly: a newer original firmware in outglow/original-firmware gets tested
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  site:
    uses: ./.github/workflows/site.yml
    with:
      base: /outglow/
      ref: ${{ github.sha }}
    # the original firmware's deploy key, for the comparison page's tests
    secrets: inherit

  root:
    # (the root site has no original images: its comparison page shows the committed results)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Have outglow.github.io build this commit
        env:
          KEY: ${{ secrets.ROOT_SITE_DEPLOY_KEY }}
        run: |
          install -m 600 /dev/null ~/key && printf '%s\n' "$KEY" > ~/key
          export GIT_SSH_COMMAND="ssh -i ~/key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone -q --depth 1 git@github.com:outglow/outglow.github.io.git root
          cd root
          echo "${{ github.sha }}" > SOURCE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SOURCE
          git commit -q -m "Build outglow/outglow@${GITHUB_SHA::7}" --allow-empty
          git push -q origin HEAD:main
